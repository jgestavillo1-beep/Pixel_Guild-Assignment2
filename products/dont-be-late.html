<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Be Late Tee | Sense</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Teachers:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="product-page" data-product="dont-be-late">
    <header>
        <nav class="navbar navbar-expand-lg sense-navbar" aria-label="Main navigation">
            <div class="container-fluid px-3 px-md-4">
                <a class="navbar-brand" href="../index.html">
                    <img
                        src="../images/logo.svg"
                        alt="Sense logo"
                        class="site-logo">
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#senseNavbar"
                    aria-controls="senseNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="senseNavbar">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="shop.html">
                                Shop
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html#about">
                                About
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../contact.html">
                                Contact
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container product-container">
        <div class="row align-items-center g-5">
            <section class="col-md-6" aria-label="Product gallery">
                <div class="product-gallery">
                    <p id="image-view-label" class="image-label">
                        FRONT
                    </p>
                    <div class="product-image-wrapper">
                        <img
                            id="product-image"
                            src="../images/products/dont-be-late-front.jpg"
                            alt="Front view of the Don't Be Late Tee"
                            class="product-image">
                    </div>
                    <div class="gallery-controls">
                        <button
                            type="button"
                            id="previous-image"
                            class="gallery-button"
                            aria-label="View previous product image"
                            disabled>
                            ←
                        </button>
                        <button
                            type="button"
                            id="next-image"
                            class="gallery-button"
                            aria-label="View next product image">
                            →
                        </button>
                    </div>
                </div>
            </section>
            <section class="col-md-6" aria-labelledby="product-name">
                <div class="product-information">
                    <h1 id="product-name">
                        Don't Be Late Tee
                    </h1>
                    <p id="product-description">
                        A simple reminder to show up, get moving,
                        and make the most of the day.
                    </p>
                    <div class="product-option">
                        <p class="option-label">
                            Color
                        </p>
                        <div class="color-options">
                            <button
                                type="button"
                                id="color-swatch"
                                class="color-swatch selected"
                                aria-label="Selected product color"
                                aria-pressed="true">
                            </button>
                        </div>
                        <p id="selected-color" class="selected-color">
                            White
                        </p>
                    </div>
                    <fieldset class="product-option">
                        <legend class="option-label">
                            Size
                        </legend>
                        <div class="size-options">
                            <button type="button" class="size-button selected"
                                data-size="XS" aria-pressed="true">XS</button>
                            <button type="button" class="size-button"
                                data-size="S" aria-pressed="false">S</button>
                            <button type="button" class="size-button"
                                data-size="M" aria-pressed="false">M</button>
                            <button type="button" class="size-button"
                                data-size="L" aria-pressed="false">L</button>
                            <button type="button" class="size-button"
                                data-size="XL" aria-pressed="false">XL</button>
                            <button type="button" class="size-button"
                                data-size="XXL" aria-pressed="false">XXL</button>
                            <button type="button" class="size-button"
                                data-size="3XL" aria-pressed="false">3XL</button>
                        </div>
                    </fieldset>
                    <p class="product-price" id="product-price">
                        ₱499.00
                    </p>
                    <p class="product-category">
                        UNISEX
                    </p>
                </div>
                <div class="order-controls">
                    <div class="quantity-selector">
                        <button
                            type="button"
                            id="decrease-quantity"
                            aria-label="Decrease quantity"
                            disabled>
                            −
                        </button>
                        <output id="quantity" aria-live="polite">
                            1
                        </output>
                        <button
                            type="button"
                            id="increase-quantity"
                            aria-label="Increase quantity">
                            +
                        </button>
                    </div>
                    <button
                        type="button"
                        id="order-now"
                        class="order-button">
                        Order Now
                    </button>
                </div>
                <p class="order-feedback" id="order-feedback" aria-live="polite"></p>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <a href="../index.html" class="footer-brand">
            Sense
        </a>
        <div class="footer-links">
            <a href="../privacy.html">
                Privacy Policy
            </a>
            <a href="../contact.html">
                Contact Us
            </a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
</body>
</html>
