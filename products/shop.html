<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sense | Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Teachers:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="shop-page">
    <header>
        <nav class="navbar navbar-expand-md" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img
                        src="../images/logo.svg"
                        alt="Sense logo"
                        class="logo">
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#senseNavbar"
                    aria-controls="senseNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="senseNavbar">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="../index.html">Home</a>
                        <a class="nav-link active" href="shop.html" aria-current="page">Shop</a>
                        <a class="nav-link" href="../contact.html">Contact Us</a>
                        <a class="nav-link" href="../privacy.html">Privacy Policy</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="shop-section">
        <h1 class="shop-title">T-Shirts</h1>
        <div class="product-grid">
            <div class="product-card">
                <a href="dont-be-late.html" class="product-link">
                    <div class="product-image">
                        <img
                            src="../images/products/dont-be-late-front.jpg"
                            alt="Don't Be Late Tee">
                    </div>
                    <div class="product-info">
                        <h2>Don't Be Late Tee</h2>
                        <p class="price">₱499.00</p>
                        <p class="category">UNISEX</p>
                    </div>
                </a>
            </div>
            <div class="product-card">
                <a href="find-your-comfort.html" class="product-link">
                    <div class="product-image">
                        <img
                            src="../images/products/find-your-comfort-front.jpg"
                            alt="Everyday Comfort Tee">
                    </div>
                    <div class="product-info">
                        <h2>Everyday Comfort Tee</h2>
                        <p class="price">₱499.00</p>
                        <p class="category">UNISEX</p>
                    </div>
                </a>
            </div>

            <div class="product-card">
                <a href="do-good-work.html" class="product-link">
                    <div class="product-image">
                        <img
                            src="../images/products/do-good-work-front.jpg"
                            alt="Do Good Work Tee">
                    </div>
                    <div class="product-info">
                        <h2>Do Good Work Tee</h2>
                        <p class="price">₱499.00</p>
                        <p class="category">UNISEX</p>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <a href="../index.html" class="footer-logo">Sense</a>
        <a href="../privacy.html">
            Privacy Policy
        </a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../script.js"></script>
</body>
</html>
