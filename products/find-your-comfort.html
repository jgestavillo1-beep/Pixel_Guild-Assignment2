
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Your Comfort | Sense</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">

   <!-- important.. this is to host the Teachers font in our branding!-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teachers&display=swap" rel="stylesheet">

</head>

<body data-product="find-your-comfort">

<!-- NAVBAR -->

    <header>

        <nav class="navbar navbar-expand-lg">

            <div class="container">

                <a class="navbar-brand" href="../index.html">

                    <img
                        src="../images/logo.svg"
                        alt="Sense"
                        class="logo">

                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#senseNavbar"
                    aria-controls="senseNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="senseNavbar">

                    <div class="navbar-nav ms-auto">

                        <a class="nav-link" href="../index.html">
                            Home
                        </a>

                        <a class="nav-link" href="../index.html#shop">
                            Shop
                        </a>

                        <a class="nav-link" href="../contact.html">
                            Contact Us
                        </a>

                        <a class="nav-link" href="../privacy.html">
                            Privacy Policy
                        </a>

                    </div>

                </div>

            </div>

        </nav>

    </header>


<!-- PRODUCT -->

    <main class="container product-container">

        <div class="row align-items-center g-5">


            <!-- LEFT: PRODUCT IMAGE -->

            <section class="col-md-6" aria-label="Product gallery">

                <div class="product-gallery">

                    <p id="image-view-label" class="image-label">
                        FRONT
                    </p>

                    <div class="product-image-wrapper">

                        <img
                            id="product-image"
                            src=""
                            alt=""
                            class="img-fluid product-image">

                    </div>


<!-- IMAGE -->

                    <div class="gallery-controls">

                        <button
                            type="button"
                            id="previous-image"
                            class="gallery-button"
                            aria-label="View front product image"
                            disabled>

                            &#8592;

                        </button>

                        <button
                            type="button"
                            id="next-image"
                            class="gallery-button"
                            aria-label="View next product image">

                            &#8594;

                        </button>

                    </div>

                </div>

            </section>


<!-- RIGHT: product info -->

            <section class="col-md-6" aria-labelledby="product-name">

                <div class="product-information">

                    <h1 id="product-name">
                        Don't Be Late Tee
                    </h1>


                    <p id="product-description">

                        A simple reminder to show up, get moving,
                        and make the most of the day.

                    </p>


<!-- COLOR -->

                    <div class="product-option">

                        <p class="option-label">Color</p>

                        <div class="color-options">

                            <button
                                type="button"
                                id="color-swatch"
                                class="color-swatch selected"
                                aria-label="Selected product color"
                                aria-pressed="true">

                            </button>

                        </div>

                        <p
                            id="selected-color"
                            class="selected-color">

                            White

                        </p>

                    </div>


<!-- SIZE -->

                    <fieldset class="product-option">

                        <legend class="option-label">
                            Size
                        </legend>

                        <div class="size-options">

                            <button type="button"
                                class="size-button selected"
                                data-size="XS"
                                aria-pressed="true">XS</button>

                            <button type="button"
                                class="size-button"
                                data-size="S"
                                aria-pressed="false">S</button>

                            <button type="button"
                                class="size-button"
                                data-size="M"
                                aria-pressed="false">M</button>

                            <button type="button"
                                class="size-button"
                                data-size="L"
                                aria-pressed="false">L</button>

                            <button type="button"
                                class="size-button"
                                data-size="XL"
                                aria-pressed="false">XL</button>

                            <button type="button"
                                class="size-button"
                                data-size="XXL"
                                aria-pressed="false">XXL</button>

                            <button type="button"
                                class="size-button"
                                data-size="3XL"
                                aria-pressed="false">3XL</button>

                        </div>

                    </fieldset>


<!-- PRICE -->

                    <p class="product-price" id="product-price">
                    </p>

                    <p class="product-category">
                        UNISEX
                    </p>

</div>


<!-- QUANTITY AND ORDER -->

                    <div class="order-controls">

                    <div class="quantity-selector">
    <button
        type="button"
        id="decrease-quantity"
        aria-label="Decrease quantity"
        disabled>
        &minus;
    </button>

    <output id="quantity" aria-live="polite">1</output>

    <button
        type="button"
        id="increase-quantity"
        aria-label="Increase quantity">
        +
    </button>

    
</div>

        <button
            type="button"
            id="order-now"
            class="order-button">
                Order Now

        </button>



                </div>

            </section>

        </div>

    </main>


<!-- FOOTER -->

    <footer class="site-footer">

        <div class="container d-flex justify-content-between align-items-center">

            <a href="../index.html" class="footer-brand">
                Sense
            </a>

            <a href="../privacy.html">
                Privacy Policy
            </a>

        </div>

    </footer>


<!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js">
    </script>


<!-- Custom JavaScript -->

    <script src="../js/script.js"></script>

</body>

</html>
